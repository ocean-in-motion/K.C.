<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Let's Go Roscoe! | K.C. Long</title>
  <meta name="description" content="Help Roscoe jump the trash bags and dumpsters. Some of them are on fire.">
  <meta name="theme-color" content="#5cb8ff">
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="../assets/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&display=swap">
  <style>
/* Layout: full-screen canvas runner; HUD bar on top, start / game-over card centered over the road */
:root {
  --bg: #5cb8ff;
  --ink: #111111;
  --paper: #ffffff;
  --muted: #0e2a45;
  --font-display: "Bowlby One", "Arial Black", Impact, sans-serif;
  --font-body: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; touch-action: none; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); position: relative; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; touch-action: none; }
#game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: pointer; }
.hud {
  position: absolute; left: 0; right: 0; top: 0; z-index: 2;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding-top: max(12px, env(safe-area-inset-top, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  pointer-events: none;
}
.hud a, .hud .score { pointer-events: auto; }
.chip {
  display: inline-flex; align-items: center; gap: 8px; min-height: 44px; box-sizing: border-box;
  padding: 8px 14px; font-weight: 700; font-size: .95rem; color: var(--ink); text-decoration: none;
  background: var(--paper); border: 3px solid var(--ink); border-radius: 12px; box-shadow: 3px 3px 0 var(--ink);
}
.chip:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
.score { font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.score b { font-family: var(--font-display); font-weight: 400; font-size: 1.05rem; }
.score small { font-weight: 600; color: var(--muted); }
.card {
  position: absolute; left: 50%; top: 42%; z-index: 3; transform: translate(-50%, -50%);
  width: min(380px, calc(100% - 32px)); box-sizing: border-box;
  display: grid; gap: 12px; justify-items: center; text-align: center;
  padding: 22px 20px; background: var(--paper); border: 3px solid var(--ink); border-radius: 18px; box-shadow: 6px 6px 0 var(--ink);
}
.card h1 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: clamp(1.7rem, 7vw, 2.2rem); line-height: 1; text-wrap: balance; }
.card p { margin: 0; color: var(--muted); font-weight: 500; line-height: 1.4; text-wrap: balance; }
.card .big { font-family: var(--font-display); font-size: 2.4rem; line-height: 1; color: var(--ink); font-variant-numeric: tabular-nums; }
.card .row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px; box-sizing: border-box;
  padding: 10px 20px; font: inherit; font-weight: 700; font-size: 1.02rem; text-decoration: none; cursor: pointer;
  border: 3px solid var(--ink); border-radius: 14px; touch-action: manipulation;
}
.btn.go { background: var(--ink); color: var(--paper); box-shadow: 4px 4px 0 var(--muted); }
.btn.alt { background: var(--paper); color: var(--ink); box-shadow: 4px 4px 0 var(--ink); }
.btn:active { transform: translate(2px, 2px); }
.btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
.keys { font-size: .85rem; }
  </style>
</head>
<body>
<canvas id="game" aria-label="Let's Go Roscoe game. Tap, click or press Space to jump."></canvas>
<div class="hud">
  <a class="chip" href="../">&larr; Back</a>
  <div class="chip score" aria-live="off"><b><span id="score">0</span> m</b> <small>BEST <span id="best">0</span> m</small></div>
</div>
<div class="card" id="startCard">
  <h1>Let&rsquo;s Go Roscoe!</h1>
  <p>Tap, click or press Space to jump the trash bags and dumpsters. Some of the dumpsters are on fire.</p>
  <button class="btn go" id="startBtn" type="button">Start &rarr;</button>
  <p class="keys" id="portraitHint" hidden>Tip: turn your phone sideways for a longer road.</p>
</div>
<div class="card" id="overCard" hidden>
  <h1 id="overTitle">Roscoe hit the trash!</h1>
  <div class="big" id="finalScore">0</div>
  <p id="bestLine">Best: 0 m</p>
  <div class="row">
    <button class="btn go" id="againBtn" type="button">Play again</button>
    <a class="btn alt" href="../">&larr; Back to K.C. Long</a>
  </div>
  <p class="keys">Space or tap to jump</p>
</div>
<script>
(function () {
  var canvas = document.getElementById("game"), ctx = canvas.getContext("2d");
  var scoreEl = document.getElementById("score"), bestEl = document.getElementById("best");
  var startCard = document.getElementById("startCard"), overCard = document.getElementById("overCard");
  var finalScore = document.getElementById("finalScore"), bestLine = document.getElementById("bestLine"), overTitle = document.getElementById("overTitle");
  var portraitHint = document.getElementById("portraitHint");
  var carImg = new Image(); carImg.src = "../assets/roscoe-car-bandit7.png";
  var logoImg = new Image(); logoImg.src = "../assets/skyline-logo.jpg";
  var LOGO_ASPECT = 420 / 348;
  var MILESTONES = [50, 100, 200, 300, 500, 750, 1000];
  function milestoneAfter(i) { return i < MILESTONES.length ? MILESTONES[i] : 1000 + (i - MILESTONES.length + 1) * 500; }
  var signs = [], signIdx = 0;
  var CAR_ASPECT = 254 / 899;

  // ---------- tuning (in car-widths "U") ----------
  var JUMP_T = 0.9, JUMP_H = 1.15;
  var G = 8 * JUMP_H / (JUMP_T * JUMP_T), V0 = G * JUMP_T / 2;
  var SPEED0 = 2.4, SPEED_MAX = 5.4, ACCEL = 0.045, speedCap = SPEED_MAX;

  // ---------- sizing ----------
  var W = 0, H = 0, DPR = 1, U = 160, GROUND = 0, CAR_X = 0;
  function resize() {
    DPR = Math.min(2, window.devicePixelRatio || 1);
    W = canvas.clientWidth || window.innerWidth; H = canvas.clientHeight || window.innerHeight;
    canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    var oldU = U, oldCarX = CAR_X;
    U = Math.max(120, Math.min(240, W * 0.34, H * 0.4));
    GROUND = Math.round(H * 0.72);
    CAR_X = W - Math.max(16, W * 0.08) - U;
    if (state !== "ready" && oldU) {
      // rescale everything on the road around Roscoe so nothing jumps or teleports
      var k = U / oldU;
      for (var i = 0; i < obstacles.length; i++) { var o = obstacles[i]; o.x = CAR_X - (oldCarX - o.x) * k; o.w *= k; o.h *= k; }
      carY *= k; carVY *= k; nextGap *= k; puffs = []; embers = [];
    }
    // keep at least ~0.55s between an obstacle appearing and reaching Roscoe
    speedCap = Math.max(3, Math.min(SPEED_MAX, (CAR_X + U * 0.12) / (U * 0.55)));
    portraitHint.hidden = !(H > W * 1.2);
    // only redraw the city when the width really changes (not when the address bar slides)
    if (Math.abs(W - skylineW) > 1 || !skyline.length) { buildSkyline(); skylineW = W; }
  }

  // ---------- state ----------
  var state = "ready", speed = SPEED0, dist = 0, meters = 0, score = 0, best = 0, time = 0, pressAt = -1;
  var carY = 0, carVY = 0, tilt = 0, shake = 0;
  var obstacles = [], puffs = [], embers = [], nextGap = 0, spawned = 0;
  var scrollFar = 0, scrollMid = 0, scrollRoad = 0;
  try { best = parseInt(localStorage.getItem("roscoeBest") || "0", 10) || 0; } catch (e) { best = 0; }
  bestEl.textContent = best;

  // ---------- scenery ----------
  var skyline = [], clouds = [], skylineW = 0;
  function rand(a, b) { return a + Math.random() * (b - a); }
  function buildSkyline() {
    skyline = []; var x = 0;
    while (x < W + 400) { var bw = rand(0.35, 0.8) * U, bh = rand(0.5, 1.6) * U; skyline.push({ x: x, w: bw, h: bh, win: Math.random() < 0.7 }); x += bw + rand(0.02, 0.12) * U; }
    clouds = []; for (var i = 0; i < 5; i++) clouds.push({ x: rand(0, W), y: rand(0.08, 0.38) * H, s: rand(0.5, 1.1) });
  }
  function drawScene(dt) {
    var sky = ctx.createLinearGradient(0, 0, 0, GROUND);
    sky.addColorStop(0, "#5cb8ff"); sky.addColorStop(1, "#a9dcff");
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, GROUND);
    // clouds
    ctx.fillStyle = "rgba(255,255,255,.9)";
    for (var i = 0; i < clouds.length; i++) {
      var c = clouds[i]; var cx = ((c.x + scrollFar * 0.4) % (W + 200)) - 100, r = U * 0.18 * c.s;
      ctx.beginPath(); ctx.arc(cx, c.y, r, 0, 7); ctx.arc(cx + r * 1.1, c.y - r * 0.4, r * 1.2, 0, 7); ctx.arc(cx + r * 2.3, c.y, r * 0.95, 0, 7); ctx.fill();
    }
    // skyline (parallax, wraps)
    var span = skyline.length ? skyline[skyline.length - 1].x + skyline[skyline.length - 1].w : W;
    var off = scrollMid % span;
    for (var k = -1; k <= 1; k++) {
      for (i = 0; i < skyline.length; i++) {
        var b = skyline[i], bx = b.x + off + k * span;
        if (bx > W || bx + b.w < 0) continue;
        ctx.fillStyle = "#86c8f7"; ctx.fillRect(bx, GROUND - b.h, b.w, b.h);
        if (b.win) {
          ctx.fillStyle = "rgba(255,255,255,.55)";
          var ws = U * 0.07;
          for (var wy = GROUND - b.h + ws; wy < GROUND - ws * 1.5; wy += ws * 2) for (var wx = bx + ws * 0.8; wx < bx + b.w - ws; wx += ws * 1.9) ctx.fillRect(wx, wy, ws * 0.8, ws);
        }
      }
    }
    // highway signs sit behind the sidewalk and roll by slower than the road
    for (var si = 0; si < signs.length; si++) drawSign(signs[si]);
    // sidewalk + curb
    ctx.fillStyle = "#d9e3ec"; ctx.fillRect(0, GROUND - U * 0.06, W, U * 0.06);
    ctx.fillStyle = "#111"; ctx.fillRect(0, GROUND - 2, W, 3);
    // road
    ctx.fillStyle = "#2b2d31"; ctx.fillRect(0, GROUND + 1, W, H - GROUND);
    var laneY = GROUND + (H - GROUND) * 0.42, dash = U * 0.45, gap = U * 0.35;
    ctx.fillStyle = "#f2f2f2";
    var start = (scrollRoad % (dash + gap)) - (dash + gap);
    for (var dx = start; dx < W; dx += dash + gap) ctx.fillRect(dx, laneY, dash, Math.max(4, U * 0.03));
  }

  // ---------- milestone highway signs ----------
  var SIGN_DEPTH = 0.45; // signs move at 45% of road speed, so they read as further back
  function signSize() { var w = Math.max(132, U * 1.1); return { w: w, h: w * 0.44 }; }
  // left edge of a sign so its center meets Roscoe's center exactly when the distance hits its number
  function signX(label) { return CAR_X + U / 2 - signSize().w / 2 - (label - meters) * (U / 4) * SIGN_DEPTH; }
  function rrect(x, y, w, h, r) {
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h); ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r); ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
  }
  function drawSign(sg) {
    var sz = signSize(), w = sz.w, h = sz.h, x = signX(sg.label);
    if (x > W + 10 || x + w < -10) return;
    var postTop = GROUND - U * 0.06, boardBottom = Math.max(h + 70, GROUND - U * 0.9), y = boardBottom - h;
    // posts
    ctx.fillStyle = "#8a96a3"; ctx.strokeStyle = "#111"; ctx.lineWidth = 2;
    [x + w * 0.22, x + w * 0.78].forEach(function (px) { ctx.fillRect(px - 4, boardBottom - 2, 8, postTop - boardBottom + 2); ctx.strokeRect(px - 4, boardBottom - 2, 8, postTop - boardBottom + 2); });
    // board
    ctx.fillStyle = "#000"; rrect(x, y, w, h, 8); ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = "#111"; rrect(x, y, w, h, 8); ctx.stroke();
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 2.5; rrect(x + 5, y + 5, w - 10, h - 10, 5); ctx.stroke();
    // logo on the left
    var lh = h - 18, lw = lh / LOGO_ASPECT, lx = x + w * 0.1;
    if (logoImg.complete && logoImg.naturalWidth) ctx.drawImage(logoImg, lx, y + 9, lw, lh);
    // distance on the right
    var tl = lx + lw, tr = x + w - 10, tx = (tl + tr) / 2;
    ctx.fillStyle = "#fff"; ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
    var num = String(sg.label), fs = Math.min(h * 0.46, (tr - tl - 8) / (num.length * 0.62 + 0.9));
    ctx.font = "400 " + fs + "px 'Bowlby One', 'Arial Black', Impact, sans-serif";
    ctx.fillText(num, tx, y + h * 0.6);
    ctx.font = "700 " + Math.max(9, h * 0.15) + "px 'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif";
    ctx.fillStyle = "#5cb8ff";
    ctx.fillText("METERS", tx, y + h * 0.84);
    ctx.textAlign = "start";
  }

  // ---------- obstacles ----------
  function bagPath(x, y, w, h) {
    ctx.beginPath();
    ctx.moveTo(x + w * 0.5, y + h * 0.16);
    ctx.bezierCurveTo(x + w * 0.85, y + h * 0.2, x + w * 1.02, y + h * 0.62, x + w * 0.93, y + h * 0.9);
    ctx.quadraticCurveTo(x + w * 0.88, y + h, x + w * 0.5, y + h);
    ctx.quadraticCurveTo(x + w * 0.12, y + h, x + w * 0.07, y + h * 0.9);
    ctx.bezierCurveTo(x - w * 0.02, y + h * 0.62, x + w * 0.15, y + h * 0.2, x + w * 0.5, y + h * 0.16);
    ctx.closePath();
  }
  function drawBag(x, y, w, h) {
    ctx.lineWidth = Math.max(2, U * 0.016); ctx.strokeStyle = "#fff"; ctx.fillStyle = "#161616";
    bagPath(x, y, w, h); ctx.fill(); ctx.stroke();
    // tie
    ctx.beginPath(); ctx.moveTo(x + w * 0.5, y + h * 0.18);
    ctx.quadraticCurveTo(x + w * 0.32, y - h * 0.02, x + w * 0.4, y + h * 0.02);
    ctx.moveTo(x + w * 0.5, y + h * 0.18);
    ctx.quadraticCurveTo(x + w * 0.7, y - h * 0.04, x + w * 0.62, y + h * 0.03);
    ctx.stroke();
    // shine
    ctx.beginPath(); ctx.lineWidth = Math.max(1.5, U * 0.011);
    ctx.arc(x + w * 0.36, y + h * 0.55, w * 0.18, Math.PI * 1.05, Math.PI * 1.45); ctx.stroke();
  }
  function drawDumpster(x, y, w, h) {
    var lw = Math.max(2, U * 0.016);
    ctx.lineWidth = lw; ctx.strokeStyle = "#fff"; ctx.lineJoin = "round";
    var bodyTop = y + h * 0.2, inset = w * 0.06;
    // body
    ctx.fillStyle = "#1c1e21";
    ctx.beginPath(); ctx.moveTo(x, bodyTop); ctx.lineTo(x + w, bodyTop); ctx.lineTo(x + w - inset, y + h * 0.9); ctx.lineTo(x + inset, y + h * 0.9); ctx.closePath(); ctx.fill(); ctx.stroke();
    // brand stripe
    ctx.fillStyle = "#5cb8ff"; ctx.fillRect(x + inset * 0.9, bodyTop + h * 0.26, w - inset * 1.8, h * 0.14);
    // ribs
    ctx.strokeStyle = "rgba(255,255,255,.35)"; ctx.lineWidth = Math.max(1.5, U * 0.01);
    for (var i = 1; i < 4; i++) { var rx = x + (w / 4) * i; ctx.beginPath(); ctx.moveTo(rx, bodyTop + h * 0.05); ctx.lineTo(rx - (rx - (x + w / 2)) * 0.06, y + h * 0.86); ctx.stroke(); }
    // lid (propped open a bit)
    ctx.strokeStyle = "#fff"; ctx.lineWidth = lw; ctx.fillStyle = "#111";
    ctx.beginPath(); ctx.moveTo(x - w * 0.03, bodyTop); ctx.lineTo(x + w * 1.03, bodyTop); ctx.lineTo(x + w * 0.98, y); ctx.lineTo(x + w * 0.05, y + h * 0.06); ctx.closePath(); ctx.fill(); ctx.stroke();
    // wheels
    ctx.fillStyle = "#111";
    [x + w * 0.18, x + w * 0.82].forEach(function (wx) { ctx.beginPath(); ctx.arc(wx, y + h * 0.93, h * 0.07, 0, 7); ctx.fill(); ctx.stroke(); });
  }
  function drawFire(cx, baseY, w, h, t, seed) {
    var tongues = [[-0.32, 0.62], [0.3, 0.7], [0, 1]], layers = [["#ff4d1f", 1], ["#ff9f1c", 0.72], ["#ffe066", 0.42]];
    for (var L = 0; L < layers.length; L++) {
      ctx.fillStyle = layers[L][0]; var s = layers[L][1];
      for (var i = 0; i < tongues.length; i++) {
        var ox = tongues[i][0] * w * 0.5, th = h * tongues[i][1] * s * (0.82 + 0.18 * Math.sin(t * 14 + seed + i * 2.1));
        var sway = Math.sin(t * 9 + seed * 3 + i) * w * 0.08, bw = w * 0.42 * (0.55 + s * 0.45);
        ctx.beginPath();
        ctx.moveTo(cx + ox - bw / 2, baseY);
        ctx.quadraticCurveTo(cx + ox - bw * 0.55, baseY - th * 0.55, cx + ox + sway, baseY - th);
        ctx.quadraticCurveTo(cx + ox + bw * 0.55, baseY - th * 0.55, cx + ox + bw / 2, baseY);
        ctx.closePath(); ctx.fill();
      }
    }
  }
  var TYPES = [
    { kind: "bag",      w: 0.30, h: 0.28, weight: 0.38 },
    { kind: "bags",     w: 0.52, h: 0.30, weight: 0.32 },
    { kind: "dumpster", w: 0.50, h: 0.40, weight: 0.30 }
  ];
  function spawn() {
    var r = Math.random(), acc = 0, t = TYPES[0];
    for (var i = 0; i < TYPES.length; i++) { acc += TYPES[i].weight; if (r < acc) { t = TYPES[i]; break; } }
    var fire = t.kind === "dumpster" && spawned >= 2 && Math.random() < 0.6;
    var w = t.w * U, h = t.h * U;
    obstacles.push({ kind: t.kind, x: -w - 10, w: w, h: h, fire: fire, seed: Math.random() * 10 });
    spawned++;
    var minGap = speed * U * (JUMP_T + 0.32);
    nextGap = minGap + Math.random() * speed * U * 0.9;
  }
  function drawObstacle(o) {
    var y = GROUND - o.h;
    if (o.kind === "dumpster") drawDumpster(o.x, y, o.w, o.h);
    else if (o.kind === "bags") { drawBag(o.x + o.w * 0.42, y + o.h * 0.08, o.w * 0.58, o.h * 0.92); drawBag(o.x, y, o.w * 0.6, o.h); }
    else drawBag(o.x, y, o.w, o.h);
    if (o.fire) drawFire(o.x + o.w / 2, y + o.h * 0.12, o.w * 0.9, U * 0.34, time, o.seed);
  }
  function hitbox(o) {
    var top = GROUND - o.h + o.h * 0.12;
    if (o.fire) top -= U * 0.16;
    return { l: o.x + o.w * 0.1, r: o.x + o.w * 0.9, t: top, b: GROUND };
  }

  // ---------- car ----------
  function carBox() {
    var ch = U * CAR_ASPECT, top = GROUND - ch - carY;
    return { l: CAR_X + U * 0.12, r: CAR_X + U * 0.86, t: top + ch * 0.3, b: top + ch - 2 };
  }
  function drawCar() {
    var ch = U * CAR_ASPECT, top = GROUND - ch - carY + (carY === 0 && state === "play" ? Math.sin(time * 28) * 0.8 : 0);
    ctx.save();
    ctx.translate(CAR_X + U / 2, top + ch / 2); ctx.rotate(tilt * Math.PI / 180);
    if (carImg.complete && carImg.naturalWidth) ctx.drawImage(carImg, -U / 2, -ch / 2, U, ch);
    ctx.restore();
    // shadow on the road while airborne
    if (carY > 2) { ctx.fillStyle = "rgba(0,0,0," + Math.max(0.08, 0.3 - carY / (U * 4)) + ")"; ctx.beginPath(); ctx.ellipse(CAR_X + U / 2, GROUND + 3, U * 0.42 * (1 - carY / (U * 3)), U * 0.03, 0, 0, 7); ctx.fill(); }
  }
  function jump() {
    if (state !== "play") return;
    pressAt = time; // remembered briefly, so a tap just before landing still counts
    if (carY <= 0.5) { pressAt = -1; carVY = V0 * U; carY = 0.01; for (var i = 0; i < 4; i++) puffs.push({ x: CAR_X + U * rand(0.2, 0.8), y: GROUND - 4, r: U * rand(0.03, 0.06), a: 0.7, vx: rand(10, 40), vy: rand(-20, -5) }); }
  }

  // ---------- flow ----------
  function setScore(v) { if (v === score) return; score = v; scoreEl.textContent = v; }
  function startGame() {
    state = "play"; speed = SPEED0; dist = 0; meters = 0; pressAt = -1; time = 0; carY = 0; carVY = 0; tilt = 0; shake = 0;
    obstacles = []; puffs = []; embers = []; signs = []; signIdx = 0; spawned = 0; nextGap = U * 1.6; score = -1; setScore(0);
    startCard.hidden = true; overCard.hidden = true; canvas.focus && canvas.focus();
  }
  function crash() {
    state = "over"; shake = 1;
    if (score > best) { best = score; try { localStorage.setItem("roscoeBest", String(best)); } catch (e) {} bestEl.textContent = best; overTitle.textContent = "New best! Nice driving."; }
    else overTitle.textContent = ["Roscoe hit the trash!", "Dumpster: 1, Roscoe: 0", "Trash panda down!"][(Math.random() * 3) | 0];
    finalScore.textContent = score + " m"; bestLine.textContent = "Best: " + best + " m";
    setTimeout(function () { overCard.hidden = false; document.getElementById("againBtn").focus({ preventScroll: true }); }, 450);
  }

  var last = performance.now();
  function frame(now) {
    var dt = Math.min(0.05, (now - last) / 1000); last = now; time += dt;
    if (state === "play") {
      speed = Math.min(speedCap, speed + ACCEL * dt);
      var px = speed * U * dt;
      dist += px; meters += speed * dt * 4; scrollFar += px * 0.15; scrollMid += px * 0.35; scrollRoad += px;
      setScore(Math.floor(meters));
      // queue the next sign as soon as it would be on screen; it lines up with Roscoe at its distance
      while (signX(milestoneAfter(signIdx)) + signSize().w > -20) { signs.push({ label: milestoneAfter(signIdx) }); signIdx++; }
      for (var s = signs.length - 1; s >= 0; s--) { if (signX(signs[s].label) > W + 20) signs.splice(s, 1); }
      // car physics
      if (carY > 0 || carVY > 0) { carVY -= G * U * dt; carY += carVY * dt; if (carY <= 0) { carY = 0; carVY = 0; if (pressAt >= 0 && time - pressAt < 0.16) jump(); } }
      var targetTilt = carY > 0 ? Math.max(-7, Math.min(9, carVY / (V0 * U) * 9)) : 0;
      tilt += (targetTilt - tilt) * Math.min(1, dt * 10);
      // exhaust from the rear (right side of the car)
      if (Math.random() < dt * 9) puffs.push({ x: CAR_X + U * 0.98, y: GROUND - U * CAR_ASPECT * 0.25 - carY, r: U * rand(0.025, 0.05), a: 0.55, vx: rand(30, 70), vy: rand(-12, -4) });
      // obstacles
      nextGap -= px;
      if (nextGap <= 0) spawn();
      var cb = carBox();
      for (var i = obstacles.length - 1; i >= 0; i--) {
        var o = obstacles[i]; o.x += px;
        if (o.fire && Math.random() < dt * 14) embers.push({ x: o.x + o.w * rand(0.2, 0.8), y: GROUND - o.h - U * 0.1, vx: rand(-15, 25), vy: rand(-90, -40), a: 1 });
        if (o.x > W + 20) { obstacles.splice(i, 1); continue; }
        var hb = hitbox(o);
        if (cb.l < hb.r && cb.r > hb.l && cb.b > hb.t && cb.t < hb.b) { crash(); break; }
      }
    } else if (state === "ready") {
      scrollFar += dt * 8; tilt = 0;
    }
    if (shake > 0) shake = Math.max(0, shake - dt * 2.5);
    for (var p = puffs.length - 1; p >= 0; p--) { var f = puffs[p]; f.x += f.vx * dt; f.y += f.vy * dt; f.r += dt * U * 0.06; f.a -= dt * 0.9; if (f.a <= 0) puffs.splice(p, 1); }
    for (var e = embers.length - 1; e >= 0; e--) { var m = embers[e]; m.x += m.vx * dt + (state === "play" ? speed * U * dt : 0); m.y += m.vy * dt; m.a -= dt * 1.2; if (m.a <= 0) embers.splice(e, 1); }

    // ---------- draw ----------
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - 0.5) * 14 * shake, (Math.random() - 0.5) * 10 * shake);
    drawScene(dt);
    for (var j = 0; j < obstacles.length; j++) drawObstacle(obstacles[j]);
    for (e = 0; e < embers.length; e++) { var em = embers[e]; ctx.fillStyle = "rgba(255," + (150 + ((e * 37) % 90)) + ",40," + em.a + ")"; ctx.fillRect(em.x, em.y, 3, 3); }
    for (p = 0; p < puffs.length; p++) { var pf = puffs[p]; ctx.fillStyle = "rgba(235,240,245," + Math.max(0, pf.a) + ")"; ctx.beginPath(); ctx.arc(pf.x, pf.y, pf.r, 0, 7); ctx.fill(); }
    drawCar();
    ctx.restore();
    requestAnimationFrame(frame);
  }

  // ---------- input ----------
  function onPress(e) {
    if (e.target.closest && e.target.closest("a, button")) return;
    if (state === "play") { e.preventDefault(); jump(); }
  }
  window.addEventListener("pointerdown", function (e) { if (e.pointerType !== "touch") onPress(e); }, { passive: false });
  // touches: react on touchstart (no delay) and block iOS zoom, magnifier and text-select
  document.addEventListener("touchstart", function (e) {
    if (e.target.closest && e.target.closest("a, button")) return;
    e.preventDefault();
    if (state === "play") jump();
  }, { passive: false });
  document.addEventListener("touchend", function (e) { if (!(e.target.closest && e.target.closest("a, button"))) e.preventDefault(); }, { passive: false });
  document.addEventListener("gesturestart", function (e) { e.preventDefault(); });
  document.addEventListener("dblclick", function (e) { e.preventDefault(); });
  if (window.visualViewport) window.visualViewport.addEventListener("resize", resize);
  window.addEventListener("keydown", function (e) {
    if (e.code === "Space" || e.code === "ArrowUp" || e.code === "KeyW") {
      e.preventDefault();
      if (state === "play") jump(); else if (state === "ready" || !overCard.hidden) startGame();
    }
  });
  document.getElementById("startBtn").addEventListener("click", startGame);
  document.getElementById("againBtn").addEventListener("click", startGame);
  document.addEventListener("visibilitychange", function () { last = performance.now(); });
  window.addEventListener("resize", resize);
  resize();
  requestAnimationFrame(function (t) { last = t; frame(t); });
  window.__game = { get signs() { return signs; }, get speedCap() { return speedCap; }, get state() { return state; }, get speed() { return speed; }, get U() { return U; }, get spawned() { return spawned; }, get score() { return score; }, get meters() { return meters; }, signX: signX, get CAR_X() { return CAR_X; }, get obstacles() { return obstacles; }, jump: jump, carBox: carBox, hitbox: hitbox, get carY() { return carY; } };
})();
</script>

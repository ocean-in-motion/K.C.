<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>K.C. Long</title>
  <meta name="description" content="K.C. Long: cars, Instagram, YouTube, Facebook and TikTok, all in one place.">
  <meta name="theme-color" content="#5cb8ff">
  <meta property="og:title" content="K.C. Long">
  <meta property="og:description" content="Cars, Instagram, YouTube, Facebook and TikTok, all in one place.">
  <meta property="og:type" content="website">
  <link rel="icon" href="assets/rocky-head.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/main.js" defer></script>
</head>
<body>
<div class="wrap">
  <div class="logo-wrap">
    <button class="logo-btn" id="logoBtn" type="button" aria-label="Drop more Rockys">
      <img class="logo" src="assets/rocky-logo.svg" width="220" height="268" alt="Rocky logo" draggable="false">
    </button>
    <div class="hint" id="hint" aria-hidden="true">
      <span id="hintText">Tap Rocky<br>for more</span>
      <svg viewBox="0 0 60 44" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 6 C 10 26, 26 36, 52 34"/>
        <path d="M42 26 L 53 34 L 42 41"/>
      </svg>
    </div>
  </div>
  <div class="who">
    <h1>K.C. Long</h1>
    <p class="tag">Find me everywhere</p>
  </div>
  <nav>
    <a href="https://skylinedecatur.com/" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 15v-3l2-1 2.5-4h8L18 11l3 1v3h-2"/><path d="M9 15h6"/><path d="M3 15h2"/><circle cx="7" cy="15.5" r="2"/><circle cx="17" cy="15.5" r="2"/></svg>
      <span>CARS</span><b class="arrow">→</b></a>
    <a href="https://instagram.com/" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg>
      <span>Instagram</span><b class="arrow">→</b></a>
    <a href="https://youtube.com/" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="4"/><path d="M10 9l5 3-5 3z" fill="currentColor"/></svg>
      <span>YouTube</span><b class="arrow">→</b></a>
    <a href="https://facebook.com/" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M15 8h-1.5A1.5 1.5 0 0 0 12 9.5V21M9.5 13H15"/></svg>
      <span>Facebook</span><b class="arrow">→</b></a>
    <a href="https://tiktok.com/" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 3v11.5a3.5 3.5 0 1 1-3.5-3.5"/><path d="M14 3c.5 2.8 2.3 4.5 5 4.8"/></svg>
      <span>TikTok</span><b class="arrow">→</b></a>
  </nav>
</div>

<div id="rain" aria-hidden="true"></div>

<div class="boom" id="boom" aria-hidden="true"></div>
<div class="flash" id="flash" aria-hidden="true"></div>

<button class="rope" id="rope" type="button" aria-label="Flush the Rockys">
  <span class="cord"></span>
  <span class="pull">Flush</span>
</button>
</body>
</html>

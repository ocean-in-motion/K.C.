<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Thanks! | K.C. Long</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#5cb8ff">
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="../assets/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&display=swap">
  <style>
/* Layout: one centered celebration stack (starburst + spinning Roscoe + message) over a constant rain of logos */
:root {
  --bg: #5cb8ff;
  --ink: #111111;
  --paper: #ffffff;
  --muted: #0e2a45;
  --font-display: "Bowlby One", "Arial Black", Impact, sans-serif;
  --font-body: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); position: relative; }
#rain, #confetti { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
#rain { z-index: 1; }
#confetti { z-index: 1; }
#rain img { position: absolute; left: 0; top: 0; will-change: transform; user-select: none; -webkit-user-select: none; }
#confetti i { position: absolute; left: 0; top: 0; display: block; border: 1.5px solid var(--ink); will-change: transform; }
.stage {
  position: absolute; inset: 0; z-index: 2;
  overflow-y: auto; overflow-x: hidden;
  display: grid; place-items: center;
  padding-top: max(24px, env(safe-area-inset-top, 0px));
  padding-bottom: max(24px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box;
}
.party { display: grid; justify-items: center; gap: 18px; text-align: center; max-width: 520px; }
.hero { position: relative; width: min(250px, 58vw, 34vh); aspect-ratio: 1; display: grid; place-items: center; }
.burst { position: absolute; inset: -38%; width: 176%; height: 176%; animation: turn 40s linear infinite; -webkit-mask-image: radial-gradient(circle, #000 30%, transparent 68%); mask-image: radial-gradient(circle, #000 30%, transparent 68%); }
.spin { position: relative; width: 86%; height: auto; animation: pop .7s cubic-bezier(.2, 1.6, .4, 1) both; filter: drop-shadow(4px 5px 0 rgba(17, 17, 17, .35)); }
@keyframes turn { to { transform: rotate(-360deg); } }
@keyframes pop { from { scale: .2; } to { scale: 1; } }
h1 {
  margin: 0;
  font-family: var(--font-display); font-weight: 400;
  font-size: clamp(2.4rem, 10vw, 4rem); line-height: .95; letter-spacing: .01em;
  color: var(--paper);
  -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill;
  text-shadow: 4px 4px 0 var(--ink);
  text-wrap: balance;
  animation: wiggle 2.6s ease-in-out infinite;
}
@keyframes wiggle { 0%, 100% { transform: rotate(-2deg); } 50% { transform: rotate(2deg); } }
.note { margin: 0; max-width: 32ch; padding: 6px 12px; border-radius: 14px; background: var(--bg); box-shadow: 0 0 18px 10px var(--bg); font-size: 1.08rem; font-weight: 500; line-height: 1.45; color: var(--muted); text-wrap: balance; }
.back {
  display: inline-flex; align-items: center; gap: 10px;
  min-height: 52px; padding: 12px 22px; box-sizing: border-box;
  font-weight: 700; font-size: 1.05rem; color: var(--ink); text-decoration: none;
  background: var(--paper); border: 3px solid var(--ink); border-radius: 14px;
  box-shadow: 5px 5px 0 var(--ink);
  transition: transform .12s ease, box-shadow .12s ease;
}
@media (hover: hover) { .back:hover { transform: translate(-2px, -2px); box-shadow: 7px 7px 0 var(--ink); } }
.back:active { transform: translate(3px, 3px); box-shadow: 2px 2px 0 var(--ink); }
.back:focus-visible { outline: 3px solid var(--ink); outline-offset: 4px; }
  </style>
</head>
<body>
<div id="rain" aria-hidden="true"></div>
<main class="stage">
  <div class="party">
    <div class="hero">
      <svg class="burst" viewBox="-100 -100 200 200" aria-hidden="true">
        <g id="rays"></g>
      </svg>
      <img class="spin" src="../assets/roscoe-head.svg" alt="Roscoe" draggable="false">
    </div>
    <h1>Talk to you soon!</h1>
    <p class="note">Thanks for reaching out. Your message is in, and K.C. will get back to you shortly.</p>
    <a class="back" href="../">&larr; Back to K.C. Long</a>
  </div>
</main>
<div id="confetti" aria-hidden="true"></div>
<script>
(function () {
  var PIECES = [
    { src: "../assets/roscoe-head.svg",  aspect: 574 / 684, scale: 1,    weight: 0.5 },
    { src: "../assets/car.svg",   aspect: 64 / 120,  scale: 1.1,  weight: 0.17 },
    { src: "../assets/truck.svg", aspect: 66 / 132,  scale: 1.15, weight: 0.17 },
    { src: "../assets/key.svg",   aspect: 290 / 280, scale: 0.8,  weight: 0.16 }
  ];
  var COLORS = ["#ffffff", "#111111"];

  // starburst rays behind Roscoe
  var rays = document.getElementById("rays"), n = 18, html = "";
  for (var r = 0; r < n; r++) {
    var a0 = (r / n) * Math.PI * 2, a1 = a0 + Math.PI / n;
    html += '<path d="M0 0 L' + (Math.cos(a0) * 100).toFixed(1) + ' ' + (Math.sin(a0) * 100).toFixed(1) +
            ' L' + (Math.cos(a1) * 100).toFixed(1) + ' ' + (Math.sin(a1) * 100).toFixed(1) + ' Z" fill="#ffffff" opacity=".6"/>';
  }
  rays.innerHTML = html;

  var rain = document.getElementById("rain"), conf = document.getElementById("confetti");
  function W() { return document.body.clientWidth || window.innerWidth; }
  function H() { return document.body.clientHeight || window.innerHeight; }
  function pick() {
    var x = Math.random(), acc = 0;
    for (var i = 0; i < PIECES.length; i++) { acc += PIECES[i].weight; if (x < acc) return PIECES[i]; }
    return PIECES[0];
  }

  var drops = [], bits = [];
  function resetDrop(d, first) {
    var w = W(), h = H();
    var s = Math.max(0.6, Math.min(1, w / 760));
    d.size = (40 + Math.random() * 56) * s * d.kind.scale;
    d.el.style.width = d.size + "px";
    d.x = Math.random() * w;
    d.y = first ? Math.random() * h - h : -d.size - Math.random() * 120;
    d.vy = 1.6 + Math.random() * 2.6;
    d.vx = (Math.random() - 0.5) * 0.6;
    d.a = Math.random() * 360;
    d.va = (Math.random() - 0.5) * 3;
  }
  function addDrop(first) {
    var kind = pick(), img = new Image();
    img.src = kind.src; img.alt = ""; img.draggable = false;
    rain.appendChild(img);
    var d = { el: img, kind: kind };
    resetDrop(d, first); drops.push(d);
  }
  function resetBit(b, burst) {
    var w = W(), h = H();
    if (burst) {
      var ang = -Math.PI / 2 + (Math.random() - 0.5) * 2.4, sp = 7 + Math.random() * 9;
      b.x = w / 2; b.y = h * 0.4; b.vx = Math.cos(ang) * sp; b.vy = Math.sin(ang) * sp;
    } else {
      b.x = Math.random() * w; b.y = -20 - Math.random() * h * 0.5; b.vx = (Math.random() - 0.5) * 1.2; b.vy = 1.4 + Math.random() * 2;
    }
    b.a = Math.random() * 360; b.va = (Math.random() - 0.5) * 14; b.ph = Math.random() * 6.28;
  }
  function addBit(burst) {
    var el = document.createElement("i");
    var wv = 6 + Math.random() * 7, hv = 8 + Math.random() * 10;
    el.style.width = wv + "px"; el.style.height = hv + "px";
    el.style.background = COLORS[(Math.random() * COLORS.length) | 0];
    el.style.borderRadius = Math.random() < 0.3 ? "50%" : "2px";
    conf.appendChild(el);
    var b = { el: el, burst: burst };
    resetBit(b, burst); bits.push(b);
  }

  function counts() { var w = W(); return { drops: Math.round(Math.min(30, Math.max(12, w / 40))), bits: Math.round(Math.min(26, Math.max(10, w / 45))) }; }
  function start() {
    if (W() < 100 || H() < 100) return false;
    var c = counts(), i;
    for (i = 0; i < c.drops; i++) addDrop(true);
    for (i = 0; i < c.bits; i++) addBit(false);
    for (i = 0; i < 36; i++) addBit(true);
    return true;
  }
  if (!start()) { var tries = setInterval(function () { if (start()) clearInterval(tries); }, 200); }

  var last = performance.now(), t = 0;
  function tick(now) {
    var dt = Math.min(2.5, (now - last) / 16.67); last = now; t += dt;
    var w = W(), h = H(), i;
    for (i = 0; i < drops.length; i++) {
      var d = drops[i];
      d.y += d.vy * dt; d.x += d.vx * dt; d.a += d.va * dt;
      if (d.y - d.size > h) resetDrop(d, false);
      if (d.x < -d.size) d.x = w + d.size * 0.5; else if (d.x > w + d.size) d.x = -d.size * 0.5;
      d.el.style.transform = "translate(" + (d.x - d.size / 2) + "px," + (d.y - d.size * d.kind.aspect / 2) + "px) rotate(" + d.a + "deg)";
    }
    for (i = bits.length - 1; i >= 0; i--) {
      var b = bits[i];
      if (b.burst) { b.vy += 0.28 * dt; b.vx *= Math.pow(0.985, dt); if (b.vy > 4) b.vy = 4; }
      b.y += b.vy * dt; b.x += (b.vx + Math.sin(t * 0.05 + b.ph) * 0.6) * dt; b.a += b.va * dt;
      if (b.y > h + 30) {
        if (b.burst) { b.el.remove(); bits.splice(i, 1); continue; }
        resetBit(b, false);
      }
      b.el.style.transform = "translate(" + b.x + "px," + b.y + "px) rotate(" + b.a + "deg)";
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
  document.addEventListener("visibilitychange", function () { last = performance.now(); });
})();
</script>
</body>
</html>
